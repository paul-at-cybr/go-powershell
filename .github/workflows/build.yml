---
name: build
"on": [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        go-version: ["1.27.x", "stable"]
        target:
          - os: windows-latest
            goos: windows
            goarch: amd64
            run_tests: true
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            run_tests: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            run_tests: false
    runs-on: ${{ matrix.target.os }}
    env:
      GO111MODULE: "on"
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Go modules
        run: go mod download

      - name: Install PowerShell on Linux
        if: matrix.target.goos == 'linux'
        shell: bash
        run: |
          source /etc/os-release
          package_path="${RUNNER_TEMP}/packages-microsoft-prod.deb"
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -O "${package_path}"
          sudo dpkg -i "${package_path}"
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Build
        run: go build -v ./...
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}

      - name: Test
        if: matrix.target.run_tests
        run: go test -v ./...
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
